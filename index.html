<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Maison Soleil | Juan Moises Torrijos</title>
    <link rel="icon" href="assets/images/illustration-sun.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/main.js" defer></script>
</head>
<body>
    <div class="overlay visible"></div>
    <div class="main-container sidebar-visible">
        <aside class="sidebar">
            <div class="logo-nav">
                <div class="logo">
                    <img src="./assets/images/logo.svg" width="107" height="42" alt="">
                    <button class="close-button">
                        <img src="./assets/images/icon-close.svg" width="20" height="20" alt="Close">
                    </button>
                </div>
                <nav class="nav">
                    <a href="#bed" class="text-preset-5-medium active">
                        <img src="./assets/images/icon-bed.svg" width="20" height="20" alt="">
                        Your stay
                        <div class="notification-indicator text-preset-11">1</div>
                    </a>
                    <a href="#house" class="text-preset-5-medium">
                        <img src="./assets/images/icon-house.svg" width="20" height="20" alt="">
                        The house
                    </a>
                    <a href="#pin" class="text-preset-5-medium">
                        <img src="./assets/images/icon-pin.svg" width="20" height="20" alt="">
                        Around town
                    </a>
                    <a href="#breakfast" class="text-preset-5-medium">
                        <img src="./assets/images/icon-breakfast-outline.svg" width="20" height="20" alt="">
                        Breakfast
                    </a>
                    <a href="#inbox" class="text-preset-5-medium">
                        <img src="./assets/images/icon-mail.svg" width="20" height="20" alt="">
                        Messages
                    </a>
                </nav>
            </div>
            <div class="weather-footer">
                <div class="weather">
                    <p class="text-preset-10">
                        Today in Cassis
                    </p>
                    <p class="text-preset-2 degrees">
                        27°
                    </p>
                    <p class="text-preset-7">
                        Sunny · light breeze
                    </p>
                </div>
                <footer>
                    <p class="text-preset-10">Est. 1987</p>
                    <p class="text-preset-10">Maison Soleil · 12 Rue des Oliviers · Cassis</p>
                    <p class="text-preset-10">© 2026 Maison Soleil</p>
                </footer>
            </div>
        </aside>
        <main>

            <div class="mobile-header">
                <div class="logo">
                    <img src="./assets/images/logo.svg" width="107" height="42" alt="">
                    <button class="close-button">
                        <img src="./assets/images/icon-menu.svg" width="20" height="20" alt="Close">
                    </button>
                </div>            
            </div>
        </main>
    </div> 
</body>
</html>
